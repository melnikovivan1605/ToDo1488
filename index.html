<!doctype html>

<html lang="en">
  <body>
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Document</title>
      <link rel="stylesheet" href="style.css" />
    </head>
    <section class="Todo">
      <div class="todo__cont">
        <h1 class="todo_title">TODO LIST</h1>
        <div class="todo__filters">
          <input type="text" class="searchTask" placeholder="search" /><select
            name=""
            id=""
            class="sortTask"
          >
            <option value="ALL">---ALL---</option>
            <option value="Completed">Completed</option>
            <option value="notCompleted">notCompleted</option>
          </select>
        </div>
        <div class="tasks">
          <div class="task">
            <input type="checkbox" class="task__checkbox" />
            <h3 class="task__name">NOTE#1</h3>
            <img src="recycle-bin.png" alt="" class="task__del" />
          </div>
        </div>

        <img src="add (1).png" alt="" class="plus__task" />
      </div>
    </section>
  </body>
</html>
<script src="scrypt.js"></script>
